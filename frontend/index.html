<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myguo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="liquid-controls.css">
  <link rel="stylesheet" href="native-media.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar (Official Red Fruit Drama Structure) -->
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Native macOS Window Drag Area -->
      <div class="main-drag-bar"></div>

      <!-- View Containers -->
      <div class="view-viewport">
        <!-- 1. Recommend View (Vertical Swipe Video Feed - TikTok/Hongguo Style) -->
        <section class="view-page active" id="view-recommend">
          <div class="feed-container" id="feed-container">
            <!-- Video Player Stage -->
            <div class="feed-stage" id="feed-stage">
              <!-- 3-Slot Sliding Carousel Layers -->
              <div class="feed-slide-layer" id="feed-slide-0" data-slot="0">
                <video id="feed-video-0" class="feed-video portrait" playsinline webkit-playsinline crossorigin="anonymous"></video>
                <div class="feed-slide-poster" id="feed-poster-0"></div>
              </div>
              <div class="feed-slide-layer" id="feed-slide-1" data-slot="1">
                <video id="feed-video-1" class="feed-video portrait" playsinline webkit-playsinline crossorigin="anonymous"></video>
                <div class="feed-slide-poster" id="feed-poster-1"></div>
              </div>
              <div class="feed-slide-layer" id="feed-slide-2" data-slot="2">
                <video id="feed-video-2" class="feed-video portrait" playsinline webkit-playsinline crossorigin="anonymous"></video>
                <div class="feed-slide-poster" id="feed-poster-2"></div>
              </div>
              <div class="feed-slide-poster" id="feed-incoming-poster" style="display: none;"></div>

              <!-- Recommend Initial Skeleton Overlay -->
              <div class="feed-skeleton-overlay" id="feed-skeleton" style="display: none;" aria-hidden="true">
                <div class="feed-skeleton-backdrop skeleton-box"></div>
                <div class="feed-info-skeleton">
                  <div class="skeleton-line" style="width: 72px; height: 18px; margin-bottom: 12px; border-radius: 4px;"></div>
                  <div class="skeleton-line" style="width: 240px; height: 26px; margin-bottom: 14px; border-radius: 6px;"></div>
                  <div style="display: flex; gap: 8px; margin-bottom: 14px;">
                    <div class="skeleton-line" style="width: 48px; height: 20px; border-radius: 4px;"></div>
                    <div class="skeleton-line" style="width: 54px; height: 20px; border-radius: 4px;"></div>
                    <div class="skeleton-line" style="width: 60px; height: 20px; border-radius: 4px;"></div>
                  </div>
                  <div class="skeleton-line" style="width: 300px; height: 14px; border-radius: 4px;"></div>
                </div>
                <div class="feed-rail-skeleton">
                  <div class="skeleton-box" style="width: 44px; height: 44px; border-radius: 50%; margin-bottom: 24px;"></div>
                  <div class="skeleton-box" style="width: 44px; height: 44px; border-radius: 50%; margin-bottom: 24px;"></div>
                  <div class="skeleton-box" style="width: 44px; height: 44px; border-radius: 50%;"></div>
                </div>
              </div>

              <div class="video-loader" id="feed-loader" style="display: none;" role="status" aria-label="加载中">
                <div class="video-top-loader-bar"></div>
                <div class="macos-loader-hud">
                  <svg class="macos-spinner" viewBox="0 0 32 32" width="20" height="20" fill="none" aria-hidden="true">
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="1.0" transform="rotate(0 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.93" transform="rotate(30 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.86" transform="rotate(60 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.8" transform="rotate(90 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.73" transform="rotate(120 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.66" transform="rotate(150 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.59" transform="rotate(180 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.52" transform="rotate(210 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.45" transform="rotate(240 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.39" transform="rotate(270 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.32" transform="rotate(300 16 16)" />
                    <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.25" transform="rotate(330 16 16)" />
                  </svg>
                </div>
              </div>
              <div class="center-play-indicator" id="feed-play-indicator" style="display: none;">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              </div>
            </div>

            <!-- Top Center Channel/Category Bar -->
            <div class="cat-bar" id="feed-cat-bar">
              <div class="cat-bar-glider" id="feed-cat-glider"></div>
              <button class="cat-chip" data-channel="关注">关注</button>
              <button class="cat-chip active" data-channel="">推荐</button>
              <button class="cat-chip" data-channel="漫剧">漫剧</button>
              <button class="cat-chip" data-channel="真人剧">真人剧</button>
            </div>

            <!-- Left Bottom Drama Info Overlay -->
            <div class="feed-info" id="feed-info">
              <div class="feed-info-header">
                <span class="feed-info-rank" id="feed-info-rank">
                  <span id="feed-rank-text">官方推荐</span>
                </span>
                <span class="feed-episode-badge" id="feed-episode-badge">第 1 集</span>
              </div>
              <h2 class="feed-info-title" id="feed-info-title">短剧标题</h2>
              <div class="feed-info-tags" id="feed-info-tags"></div>
              <p class="feed-info-desc" id="feed-info-desc">精彩短剧，全集免费畅看</p>
            </div>

            <!-- Shared rail, controls and episode drawer are mounted by player-chrome.js -->

            <!-- Floating Feedback Hint Toast -->
            <div class="feed-hint-toast" id="feed-hint-toast" role="status" aria-live="polite" aria-atomic="true">
              <svg class="macos-spinner-sm" id="feed-hint-spinner" style="display: none;" viewBox="0 0 32 32" width="16" height="16" fill="none" aria-hidden="true">
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="1.0" transform="rotate(0 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.93" transform="rotate(30 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.86" transform="rotate(60 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.8" transform="rotate(90 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.73" transform="rotate(120 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.66" transform="rotate(150 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.59" transform="rotate(180 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.52" transform="rotate(210 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.45" transform="rotate(240 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.39" transform="rotate(270 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.32" transform="rotate(300 16 16)" />
                <line x1="16" y1="3" x2="16" y2="8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.25" transform="rotate(330 16 16)" />
              </svg>
              <span id="feed-hint-text"></span>
            </div>
          </div>
        </section>

    </main>

    <!-- Notification Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Official Episode Comment Sheet -->
    <div class="comment-sheet-overlay" id="comment-sheet-overlay" style="display: none;">
      <div class="comment-sheet" id="comment-sheet" role="dialog" aria-modal="true" aria-labelledby="comment-sheet-title">
        <div class="comment-sheet-header">
          <div>
            <h3 id="comment-sheet-title">评论</h3>
            <span id="comment-sheet-subtitle">正在加载官方评论</span>
          </div>
          <button class="icon-btn" id="btn-close-comment-sheet" title="关闭评论">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="comment-list" id="comment-list"></div>
      </div>
    </div>
  </div>

  <script src="ambient-glow.js"></script>
  <script src="player-chrome.js"></script>
  <script src="danmaku.js"></script>
  <script src="progressive-media.js"></script>
  <script src="app.js"></script>
  <script src="native-media.js"></script>
</body>
</html>
